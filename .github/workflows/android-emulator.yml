# Instrumented LAB journey (LabJourneyTest) on an Android 17 (API 37) emulator with KVM.
# Emulator evidence only; physical-device tests stay B-01. Capture stays disabled in this build.
# No licence is accepted here: sdkmanager installs only packages already covered by the runner
# image's accepted licences, and stdin is closed so any new licence prompt fails the job.
name: android-emulator

on:
  push:
    branches: [main, "impl/**"]
    paths: ["android/**", ".github/workflows/android-emulator.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-emulator.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: LabJourneyTest on API 37 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: SDK packages (no licence prompt is answered)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "emulator" "system-images;android-37.0;google_apis;x86_64" < /dev/null
      - name: Build app and instrumented-test APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Create AVD and boot headless
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci37 -k "system-images;android-37.0;google_apis;x86_64" -d pixel_7 --force
          CFG="$ANDROID_AVD_HOME/ci37.avd/config.ini"
          sed -i 's/^hw.ramSize *=.*/hw.ramSize = 4G/; s/^disk.dataPartition.size *=.*/disk.dataPartition.size = 6G/' "$CFG"
          grep -q "^disk.dataPartition.size" "$CFG" || echo "disk.dataPartition.size = 6G" >> "$CFG"
          grep -E "hw.ramSize|disk.dataPartition|image.sysdir" "$CFG"
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci37 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swangle_indirect -accel on > emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" wait-for-device
          for i in $(seq 1 120); do [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 5; done
          "$ADB" shell getprop ro.build.fingerprint
          sleep 30
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global $s 0; done
          "$ADB" shell settings put system accelerometer_rotation 0
          "$ADB" shell input keyevent 82 || true
      - name: Run LabJourneyTest (am instrument)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          run_suite() { "$ADB" shell am instrument -w -r ai.detectaclip.lab.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt; grep -q "^OK (" instrument.txt; }
          if ! run_suite; then
            echo "::group::system crash buffer"; "$ADB" logcat -b crash -d | tail -80; echo "::endgroup::"
            if grep -q "System has crashed" instrument.txt; then
              echo "Emulator system_server crashed (not a test assertion); waiting for reboot and retrying once."
              "$ADB" wait-for-device
              for i in $(seq 1 120); do [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 5; done
              sleep 30; "$ADB" shell input keyevent 82
              run_suite
            else
              exit 1
            fi
          fi
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            emulator.log
            instrument.txt
          retention-days: 14

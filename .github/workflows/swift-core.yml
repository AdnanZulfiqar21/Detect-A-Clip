# Compiles and tests the platform-independent Swift core (SwiftPM package) on a macOS runner.
# This is NOT an iOS app build, archive, signing or device test (B-02 stays open for those).
name: swift-core

on:
  push:
    branches: [main, "impl/**"]
    paths: ["ios/**", "android/app/src/test/resources/**", ".github/workflows/swift-core.yml"]
  pull_request:
    paths: ["ios/**", "android/app/src/test/resources/**", ".github/workflows/swift-core.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift build + swift test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: swift build
        working-directory: ios/DetectAClipLab
        run: swift build
      - name: swift test
        working-directory: ios/DetectAClipLab
        run: swift test

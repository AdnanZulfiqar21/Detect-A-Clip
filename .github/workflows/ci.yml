# Lightweight CI for source-level evidence only. Nothing here exercises a phone, screen
# capture, rights, legal review or release approval; those stay in docs/BLOCKERS.md.
name: ci

on:
  push:
    branches: [main, "impl/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python L0 tests + golden freshness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        # opencv headless on CI; the desktop harness itself lists opencv-python.
        run: python -m pip install "numpy>=2.0" "opencv-python-headless>=4.10" "cryptography>=42" "pytest>=8"
      - name: pytest (includes golden-file freshness for every Kotlin/Swift golden)
        working-directory: l0
        run: python -m pytest -q -o addopts="" -p no:cacheprovider

  kotlin-jvm:
    name: Pure-Kotlin JVM tests (kotlinc + JUnit, no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch kotlinc and JUnit into tools/ (git-ignored layout used by run-jvm-tests.sh)
        run: |
          mkdir -p tools/jars
          ln -s "$JAVA_HOME" tools/jdk-17-ci
          curl -fsSL -o tools/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q tools/kotlinc.zip -d tools
          curl -fsSL -o tools/jars/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o tools/jars/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: run-jvm-tests.sh
        run: bash android/run-jvm-tests.sh

  android:
    name: Android LAB app (assemble, lint, Gradle unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: SDK platform 37 (runner image SDK; no licence prompt is answered here)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" < /dev/null
      - name: assembleDebug lintDebug testDebugUnitTest
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Unit test totals (from Gradle's JUnit XML)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"testDebugUnitTest: {t} tests, {f} failures, {e} errors, {s} skipped")
          EOF
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
